# Every push and pull request: lint, the API and pipeline tests, the browser tests.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"
      - run: uv sync --frozen --group dev --group pipeline
      - run: uv run ruff check .
      - name: Browser for the Playwright tests
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
