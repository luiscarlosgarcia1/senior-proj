# Build the database and the image, and publish the image to GitHub Container
# Registry. Runs on pushes to main, by hand, and on the 1st of each month so the
# NOAA and FEMA data stay current. The server then runs:
#   docker compose pull && docker compose up -d
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"
      - run: uv sync --frozen --group pipeline

      # The publishers' downloads (~400 MB) are cached for the calendar month:
      # the first build of a month downloads fresh data, later ones reuse it.
      - name: Month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Download cache
        uses: actions/cache@v4
        with:
          path: tmp
          key: downloads-${{ steps.month.outputs.month }}

      - name: Build the database
        run: uv run --group pipeline python pipeline/build_all.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.date }}
