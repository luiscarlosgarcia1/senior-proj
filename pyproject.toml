[project]
name = "rgv-flood"
version = "0.1.0"
description = "RGV Flood Impact Visualizer — compare best-available flood-hazard data across Hidalgo, Cameron, Willacy, Starr counties"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "jinja-partials>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgv_flood"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
pipeline = [
    "beautifulsoup4>=4.15.0",
    "geopandas>=1.1.4",
    "jsonschema>=4.23.0",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "shapely>=2.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
