[project]
name = "rgv-flood"
version = "0.1.0"
description = "RGV Flood Impact Visualizer — compare best-available flood-hazard data across Hidalgo, Cameron, Willacy, Starr counties"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "jinja-partials>=0.3.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgv_flood"]

[dependency-groups]
dev = [
    "pytailwindcss>=0.4.2",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.16.6",
]
pipeline = [
    "geopandas>=1.1.4",
    "overturemaps>=1.0.2",
    "pyarrow>=25.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline", "tests"]
