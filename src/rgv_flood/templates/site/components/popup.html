{# The map popup. Filled by static/js/map/popups.js with textContent only (every value escaped). #}
<template id="popup-template">
  <div class="w-[300px] text-base">
    <div class="border-b border-line px-3.5 pb-2.5 pr-9 pt-3">
      <div class="text-md font-semibold leading-snug" data-field="title"></div>
      <div class="mt-0.5 flex flex-col gap-0.5 text-sm text-muted" data-field="lines"></div>
    </div>
    <div class="px-3.5 pb-3 pt-2.5">
      <a class="gal-photo block" data-image target="_blank" rel="noopener" title="{{ t('popup.open_photo') }}"><img alt="" loading="lazy"></a>
      {% include "site/components/photo_gallery.html" %}
      <p class="mt-2 text-sm leading-snug" data-field="body"></p>
      <a class="mt-2 inline-block text-sm" data-field="link" target="_blank" rel="noopener">{{ t("popup.source_link") }}</a>
      <p class="mt-2.5 border-t border-line pt-2 text-xs text-muted" data-field="note"></p>
    </div>
  </div>
</template>
