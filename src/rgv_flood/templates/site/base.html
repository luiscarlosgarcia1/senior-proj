<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ t("app.title") }}{% endblock %}</title>
  <script>{{ theme_bootstrap | safe }}</script>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset_url('css/site.css') }}">
  {% block head %}{% endblock %}
  <script type="application/json" id="i18n">{{ catalog | tojson }}</script>
</head>
<body class="{% block body_class %}min-h-full{% endblock %} bg-bg font-sans text-base text-ink">
  <div class="fixed inset-x-0 top-0 z-[2000] h-0.5 bg-brand" aria-hidden="true"></div>
  {% block page %}
    {% include "site/components/header.html" %}
    {% if not data_ready %}{% include "site/components/no_data.html" %}{% endif %}
    {% block content %}{% endblock %}
  {% endblock %}
  {% block scripts %}{% endblock %}
  <script type="module" src="{{ asset_url('js/store.js') }}"></script>
  <script defer src="{{ asset_url('vendor/alpine/alpine-csp.min.js') }}"></script>
</body>
</html>
