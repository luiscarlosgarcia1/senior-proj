{# Separate historic evidence: attributed reporting, never a live signal or event claim. #}
<h2 class="mb-1 text-md font-semibold">Historic news evidence</h2>
<p class="mb-2 text-xs text-muted">Historic attributed reporting only; publication time is not incident time.</p>
<ul class="flex flex-col gap-2">
  <template x-for="record in items" x-bind:key="record.id">
    <li class="leading-snug">
      <div class="mb-0.5 font-mono text-xs text-muted" x-text="meta()"></div>
      <a x-bind:href="record.source_url" target="_blank" rel="noopener" x-text="record.headline"></a>
    </li>
  </template>
</ul>
<p class="text-sm text-muted" x-show="empty" x-cloak>No historic news evidence is available for this county.</p>
