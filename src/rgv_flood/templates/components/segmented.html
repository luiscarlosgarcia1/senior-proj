{# A segmented control: one choice of several, written to the component's `name` property. #}
{% macro segmented(name, options) -%}
<div class="flex gap-0.5 rounded-lg border border-line bg-panel p-[3px]" role="group" aria-label="{{ t('claims.metric.label') }}">
  {% for value, label in options %}
  <button type="button" class="rounded-[5px] px-3.5 py-[5px] font-medium text-muted hover:text-ink" data-{{ name }}="{{ value }}"
          x-on:click="choose('{{ name }}', '{{ value }}')" x-bind:class="chosenClass('{{ name }}', '{{ value }}')"
          x-bind:aria-pressed="{{ name }} === '{{ value }}'">{{ label }}</button>
  {% endfor %}
</div>
{%- endmacro %}
