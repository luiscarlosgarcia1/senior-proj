{# Flood-related news stories, linked to the publisher (historical, not live conditions). #}
<h2 class="mb-1 text-md font-semibold">{{ t("news.title") }}</h2>
<p class="mb-2.5 text-xs text-muted">{{ t("news.note") }}</p>
<ul class="flex max-h-[360px] flex-col gap-2.5 overflow-auto">
  <template x-for="story in items" x-bind:key="story.id">
    <li class="leading-snug" data-news>{% include "components/news_story.html" %}</li>
  </template>
</ul>
<p class="text-sm text-muted" x-show="empty" x-cloak>{{ t("news.none") }}</p>
<p class="mt-2 text-sm"><a href="/news">{{ t("news.see_page") }}</a></p>
