<section class="absolute left-3 top-3 z-10 w-[min(23rem,calc(100%-1.5rem))] rounded-lg border border-line bg-panel p-3 shadow-2" data-wayfinder>
  <h2 class="text-md font-semibold">Wayfinder route advisory</h2>
  <p class="mt-1 text-sm text-muted">Enter origin and destination street addresses to request an advisory route. It does not confirm that roads are safe, open, or passable.</p>
  <form class="mt-3 grid gap-2" data-wayfinder-form>
    <label class="grid gap-1 text-sm">Origin <input required name="origin" class="rounded-md border border-line bg-bg px-2 py-1.5" placeholder="1200 W University Dr, Edinburg, TX" autocomplete="street-address"></label>
    <label class="grid gap-1 text-sm">Destination <input required name="destination" class="rounded-md border border-line bg-bg px-2 py-1.5" placeholder="100 E Expressway 83, McAllen, TX" autocomplete="street-address"></label>
    <button class="rounded-md bg-accent px-3 py-2 text-sm font-medium text-accent-ink" type="submit">Check advisory route</button>
  </form>
  <div class="mt-3 text-sm" data-wayfinder-result aria-live="polite"></div>
  <section class="mt-3 hidden border-t border-line pt-3 text-sm" data-wayfinder-active aria-live="polite"></section>
  <section class="mt-3 hidden border-t border-line pt-3 text-sm" data-wayfinder-update aria-live="polite"></section>
</section>
