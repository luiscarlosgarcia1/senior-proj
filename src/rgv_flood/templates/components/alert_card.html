{# One live alert: severity stripe, source badge, what it is, who issued it, until when. #}
<li class="flex gap-2.5 rounded-md border border-line bg-panel2 p-2.5">
  <span class="w-[3px] shrink-0 rounded-sm" x-bind:style="stripe()" aria-hidden="true"></span>
  <div class="min-w-0">
    <div class="flex items-center gap-1.5 text-xs font-semibold tracking-[.6px] text-muted">
      <span class="rounded-sm border border-line2 px-1 font-mono" data-badge x-text="badge()"></span>
    </div>
    <a class="mt-1 block font-medium leading-snug no-underline hover:underline" x-bind:href="signal.source_url" target="_blank" rel="noopener" x-text="signal.summary"></a>
    <div class="mt-0.5 text-sm text-muted" x-text="meta()"></div>
  </div>
</li>
